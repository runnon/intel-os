name: ingest-cron

# Durable 12-hour ingest scheduler. Railway's own cronSchedule was unreliable
# (the scheduled trigger did not fire — only deploy-triggered runs did), so this
# GitHub Actions cron is the source of truth: every 12 hours it re-runs the
# existing Railway `worker` service, which sweeps all six AORs and publishes a
# fresh situation update per command (AUTO-1). Off-peak minutes avoid the top of
# the hour. Requires one repo secret: RAILWAY_TOKEN (a Railway project token with
# access to the intel-os production environment).

on:
  schedule:
    - cron: "17 0,12 * * *" # 00:17 and 12:17 UTC
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

concurrency:
  group: ingest-cron
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Trigger worker ingest (redeploy re-runs the one-shot worker)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway redeploy --service worker --yes
