name: Apply Supabase migrations

# Applies pending migrations in supabase/migrations to the production database whenever
# they change on main. Runs the same `supabase db push` used locally.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   — the project's database password (Project Settings → Database)
#
# NOTE ON ORDERING: this applies ALL pending migrations. Additive migrations (new tables/
# functions) are deploy-safe. A DESTRUCTIVE migration that removes something the currently
# deployed code still uses (e.g. dropping the public read policies in
# 20260917000003_subscription_enforcement.sql) must only merge AFTER the web deploy that
# stops using it — otherwise this workflow breaks the live app the moment it merges. Keep
# migrations expand→deploy→contract, or gate destructive ones behind a manual dispatch.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: {}

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: huhrdcxvdgmuvdgwymdj
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show pending migrations
        run: supabase migration list --linked

      - name: Apply migrations
        run: supabase db push
